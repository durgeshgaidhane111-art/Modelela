<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelela - Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

  <!-- हेडर -->
  <header class="w-full max-w-md flex justify-between items-center py-4 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <a href="index.html" class="text-xs text-slate-400 hover:text-white">← Landing</a>
      <span class="text-xl font-bold text-amber-400">Modelela App</span>
    </div>
    <button id="logoutBtn" onclick="handleLogout()" class="hidden text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg">Logout</button>
  </header>

  <!-- 1. असली लॉगिन / साइनअप कार्ड -->
  <div id="authSection" class="w-full max-w-md mt-6 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
    <h2 id="authTitle" class="text-xl font-bold mb-1">लॉगिन करें</h2>
    <p class="text-xs text-slate-400 mb-6">अपने असली अकाउंट में प्रवेश करें</p>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
        <input type="email" id="email" placeholder="aapka-email@domain.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-400">
      </div>

      <!-- साइनअप फील्ड्स -->
      <div id="signupFields" class="hidden space-y-4 pt-2 border-t border-slate-800">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">पूरा नाम</label>
          <input type="text" id="fullName" placeholder="Rahul Sharma" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">अकाउंट का प्रकार</label>
          <select id="userRole" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-400">
            <option value="creator">Creator (इन्फ्लुएंसर / मॉडल)</option>
            <option value="business">Business Owner (ब्रांड / स्पॉन्सर)</option>
          </select>
        </div>
      </div>

      <button id="authSubmitBtn" onclick="handleAuthAction()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition mt-2">
        Login
      </button>

      <p class="text-center text-xs text-slate-400 mt-4">
        <span id="switchPrompt">अकाउंट नहीं है?</span>
        <button onclick="toggleAuthMode()" id="switchBtn" class="text-amber-400 font-semibold underline ml-1">साइन अप करें</button>
      </p>
    </div>
  </div>

  <!-- 2. मेन लाइव डैशबोर्ड (Login होने के बाद) -->
  <main id="appDashboard" class="w-full max-w-md mt-6 space-y-6 hidden">
    <!-- प्रोफाइल स्टेटस -->
    <div class="bg-gradient-to-r from-amber-500/10 to-transparent border border-amber-500/20 rounded-2xl p-5 flex justify-between items-center">
      <div>
        <p class="text-[10px] text-amber-400 uppercase tracking-widest font-bold">सक्रिय सत्र</p>
        <h2 id="userGreeting" class="text-lg font-bold mt-0.5">नमस्ते!</h2>
      </div>
      <span id="userRoleBadge" class="text-xs font-bold bg-amber-400 text-slate-950 px-2.5 py-1 rounded-full uppercase"></span>
    </div>

    <!-- क्रिएटर लिस्ट सेक्शन -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-200">डेटाबेस से सक्रिय क्रिएटर्स</h3>
        <button onclick="loadCreators()" class="text-xs text-amber-400 hover:underline">रिफ्रेश करें</button>
      </div>
      <div id="creatorsList" class="space-y-3">
        <p class="text-xs text-slate-500">डेटाबेस चेक हो रहा है...</p>
      </div>
    </section>

    <!-- मैसेजिंग सेक्शन (क्लाउड रियलटाइम) -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">कम्युनिटी / लाइव चैट</h3>
      <div id="chatBox" class="h-44 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 text-xs">
        <p class="text-slate-500 text-center">मेसेज लोड हो रहे हैं...</p>
      </div>
      <div class="flex gap-2">
        <input type="text" id="chatInput" placeholder="मेसेज लिखें..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-400">
        <button onclick="sendMessage()" class="bg-amber-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs">भेजें</button>
      </div>
    </section>
  </main>

    <script>
    // 1. अपनी क्रेडेंशियल्स डालें
    const SUPABASE_URL = "https://wusdenfidflzpekvncck.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yiAAP0mVLWeQb00Evr0XzA_Tj8mWSIp";

    let supabaseClient = null;

    // Supabase लोड करने की पुष्टि
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        alert("Supabase लाइब्रेरी लोड नहीं हुई। कृपया इंटरनेट कनेक्शन चेक करें।");
      }
    } catch (err) {
      alert("Supabase इनिशियलाइज़ एरर: " + err.message);
    }

    let isSignUp = false;
    let currentUser = null;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').innerText = isSignUp ? 'नया अकाउंट बनाएं' : 'लॉगिन करें';
      document.getElementById('signupFields').classList.toggle('hidden', !isSignUp);
      document.getElementById('authSubmitBtn').innerText = isSignUp ? 'Sign Up' : 'Login';
      document.getElementById('switchPrompt').innerText = isSignUp ? 'पहले से अकाउंट है?' : 'अकाउंट नहीं है?';
      document.getElementById('switchBtn').innerText = isSignUp ? 'लॉगिन करें' : 'साइन अप करें';
    }

    async function handleAuthAction() {
      const submitBtn = document.getElementById('authSubmitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!supabaseClient) {
        alert("डेटाबेस कनेक्ट नहीं है। कृपया Keys चेक करें।");
        return;
      }

      if (!email || !password) {
        alert('कृपया ईमेल और पासवर्ड दोनों भरें।');
        return;
      }

      if (password.length < 6) {
        alert('पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।');
        return;
      }

      // बटन को लोडिंग स्टेट में डालें
      submitBtn.disabled = true;
      submitBtn.innerText = "कृपया प्रतीक्षा करें...";

      try {
        if (isSignUp) {
          const fullName = document.getElementById('fullName').value.trim();
          const role = document.getElementById('userRole').value;

          if (!fullName) {
            alert('कृपया अपना पूरा नाम लिखें।');
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign Up";
            return;
          }

          const { data, error } = await supabaseClient.auth.signUp({ 
            email: email, 
            password: password 
          });

          if (error) throw error;

          if (data?.user) {
            const { error: profileError } = await supabaseClient.from('profiles').insert([
              { 
                id: data.user.id, 
                full_name: fullName, 
                role: role, 
                pricing: role === 'creator' ? 500 : 0 
              }
            ]);

            if (profileError) {
              console.error(profileError);
            }

            alert('अकाउंट सफलतापूर्वक बन गया!');
            await checkSession();
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ 
            email: email, 
            password: password 
          });

          if (error) throw error;
          await checkSession();
        }
      } catch (err) {
        alert('एरर: ' + (err.error_description || err.message));
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isSignUp ? 'Sign Up' : 'Login';
      }
    }

    async function handleLogout() {
      if (!supabaseClient) return;
      await supabaseClient.auth.signOut();
      checkSession();
    }

    async function checkSession() {
      if (!supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();

      const authSection = document.getElementById('authSection');
      const appDashboard = document.getElementById('appDashboard');
      const logoutBtn = document.getElementById('logoutBtn');

      if (session) {
        currentUser = session.user;
        authSection.classList.add('hidden');
        appDashboard.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');

        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .single();

        if (profile) {
          document.getElementById('userGreeting').innerText = `नमस्ते, ${profile.full_name}`;
          document.getElementById('userRoleBadge').innerText = profile.role;
        }

        loadCreators();
        loadMessages();
        listenToMessages();
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        appDashboard.classList.add('hidden');
        logoutBtn.classList.add('hidden');
      }
    }

    async function loadCreators() {
      if (!supabaseClient) return;
      const listContainer = document.getElementById('creatorsList');
      const { data: creators } = await supabaseClient.from('profiles').select('*').eq('role', 'creator');

      if (!creators || creators.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-slate-500">अभी कोई क्रिएटर पंजीकृत नहीं है।</p>';
        return;
      }

      listContainer.innerHTML = creators.map(c => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-sm text-white">${c.full_name}</h4>
            <p class="text-xs text-slate-400">चार्ज: ₹${c.pricing || 0}</p>
          </div>
          <span class="text-[10px] bg-amber-400/20 text-amber-400 px-2 py-1 rounded">Verified</span>
        </div>
      `).join('');
    }

    async function loadMessages() {
      if (!supabaseClient) return;
      const { data: msgs } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true }).limit(20);
      renderMessages(msgs || []);
    }

    function renderMessages(msgs) {
      const box = document.getElementById('chatBox');
      if (msgs.length === 0) {
        box.innerHTML = '<p class="text-slate-500 text-center">बातचीत शुरू करें...</p>';
        return;
      }
      box.innerHTML = msgs.map(m => `
        <div class="p-2 rounded-lg ${m.sender_id === currentUser?.id ? 'bg-amber-400/10 text-amber-200 ml-6 text-right' : 'bg-slate-900 text-slate-300 mr-6'}">
          <p>${m.message}</p>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      if (!supabaseClient || !currentUser) return;
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;

      input.value = '';
      await supabaseClient.from('messages').insert([
        { sender_id: currentUser.id, receiver_id: currentUser.id, message: msg }
      ]);
      loadMessages();
    }

    function listenToMessages() {
      if (!supabaseClient) return;
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          loadMessages();
        })
        .subscribe();
    }

    // शुरू में सेशन चेक करें
    checkSession();
  </script>
</body>
</html>
